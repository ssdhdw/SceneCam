plugins { id 'com.android.application' }
android {
    namespace 'studio.scenecam'
    compileSdk 36
    defaultConfig {
        applicationId 'studio.scenecam'
        minSdk 28
        targetSdk 35
        versionCode 10
        versionName '0.9.0'
        testInstrumentationRunner 'studio.scenecam.GridFixtureProbe'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { compileOnly 'de.robv.android.xposed:api:82' }
