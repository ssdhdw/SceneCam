name: Build APK and publish release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the APK to a GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || exit 1
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'The tag must match versionName in app/build.gradle.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret.' >&2; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scenecam-release.keystore"
          chmod 600 "$RUNNER_TEMP/scenecam-release.keystore"
      - name: Build and lint
        env:
          SCENECAM_KEYSTORE: ${{ runner.temp }}/scenecam-release.keystore
          SCENECAM_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SCENECAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:lintRelease --no-daemon
      - name: Verify and package APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/SceneCam-$VERSION.apk"
          (cd dist && sha256sum "SceneCam-$VERSION.apk" > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: SceneCam-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/scenecam-release.keystore"

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SceneCam-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Published assets are immutable; never silently replace an existing APK.
            echo "Release $tag already exists. Use a new version to publish another build." >&2
            exit 1
          fi
          cat > notes.md <<'NOTES'
          Signed release APK built by GitHub Actions from the linked source commit.

          Download the APK below and install it on your Android device. Enable SceneCam in LSPosed and select receiving apps in its scope. See the repository README for setup, architecture, and compatibility limits.

          This release uses a persistent release signing key. If an older debug-signed SceneCam is installed, uninstall it before installing this APK (export or note your scene settings first). Future releases signed with this key can update this release normally.

          SHA256SUMS.txt contains the APK checksum. This is experimental Java API virtualization; native camera/audio paths are not universally supported.
          NOTES
          gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt --target "$COMMIT" --title "SceneCam $VERSION" --notes-file notes.md
